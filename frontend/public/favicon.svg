<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bhumiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bhumiLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bhumiRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Base background container -->
  <rect width="64" height="64" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <!-- Isometric 3D Cadastral Cube / Prism -->
  <!-- Top Face -->
  <polygon points="32,12 52,23.5 32,35 12,23.5" fill="url(#bhumiTop)" />
  <!-- Left Face -->
  <polygon points="12,23.5 32,35 32,53 12,41.5" fill="url(#bhumiLeft)" />
  <!-- Right Face -->
  <polygon points="32,35 52,23.5 52,41.5 32,53" fill="url(#bhumiRight)" />
  <!-- Geometric Edges -->
  <line x1="32" y1="35" x2="32" y2="53" stroke="#0b1329" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="12" y1="23.5" x2="32" y2="35" stroke="#0b1329" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="52" y1="23.5" x2="32" y2="35" stroke="#0b1329" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Floor Stratum Line -->
  <polyline points="12,32.5 32,44 52,32.5" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-dasharray="2,2"/>
</svg>
